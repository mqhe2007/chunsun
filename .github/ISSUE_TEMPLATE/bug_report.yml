name: Bug 报告
description: 提交一个 Bug 以帮助我们改进
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这份 Bug 报告！请尽可能详细地描述问题，以便我们快速定位和修复。

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现该问题。
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 描述你期望发生什么。
      placeholder: 我期望...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么。
      placeholder: 实际发生了...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 例如 macOS 14.5 / Ubuntu 22.04 / Windows 11
      placeholder: macOS 14.5
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 春笋版本
      description: 平台版本或 CLI 版本（可通过 `chunsun --version` 或控制台关于页面查看）
      placeholder: v0.4.6
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 如有相关日志、错误信息或截图，请粘贴在此处。
      placeholder: 粘贴日志或错误信息...
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 任何其他有助于理解问题的上下文信息。
      placeholder: 其他说明...
    validations:
      required: false
